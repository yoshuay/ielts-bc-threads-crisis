<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS British Council Indonesia — Meta Threads Crisis Intelligence</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-alt: #f0f4fa;
      --border: #dce3ee;
      --text: #162032;
      --muted: #526075;
      --accent: #1d4ed8;
      --accent-soft: #e8efff;
      --critical: #b91c1c;
      --critical-bg: #fef2f2;
      --high: #c2410c;
      --high-bg: #fff7ed;
      --medium: #1d4ed8;
      --medium-bg: #eff6ff;
      --low: #15803d;
      --low-bg: #f0fdf4;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      --radius: 12px;
      --drop-color: #1d4ed8;
    }

    html[data-theme="dark"] {
      --bg: #0b1220;
      --surface: #131c2e;
      --surface-alt: #1a253b;
      --border: #26344d;
      --text: #e6edf7;
      --muted: #98a8c2;
      --accent: #60a5fa;
      --accent-soft: #172a4a;
      --critical: #f87171;
      --critical-bg: #3b1518;
      --high: #fb923c;
      --high-bg: #3b2110;
      --medium: #60a5fa;
      --medium-bg: #172a4a;
      --low: #4ade80;
      --low-bg: #113221;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      --drop-color: #60a5fa;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    html.dragging-active, html.dragging-active * { cursor: grabbing !important; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .container { max-width: 1320px; margin: 0 auto; padding: 20px 20px 48px; }

    /* Header */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
    }
    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    h1 { margin: 0 0 4px; font-size: 1.36rem; line-height: 1.25; letter-spacing: -0.01em; }
    .subtitle { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    button { font: inherit; cursor: pointer; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.83rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--surface-alt); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 4px 8px; font-size: 0.76rem; border-radius: 6px; }
    .btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    html[data-theme="dark"] .btn-primary { color: #081226; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }

    .btn-info {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-alt);
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .lang-btn[aria-pressed="true"] {
      background: var(--accent);
      color: #ffffff;
    }
    html[data-theme="dark"] .lang-btn[aria-pressed="true"] { color: #081226; }

    /* KPI Strip */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin: 18px 0 22px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 17px;
      box-shadow: var(--shadow);
    }
    .kpi-label { font-size: 0.77rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .kpi-value { font-size: 1.7rem; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .kpi-meta { font-size: 0.8rem; color: var(--muted); }

    /* Accessible Tabs */
    .tablist {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      scrollbar-width: thin;
    }
    .tablist [role="tab"] {
      flex: none;
      position: relative;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 11px 15px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .tablist [role="tab"]:hover { color: var(--text); }
    .tablist [role="tab"][aria-selected="true"] { color: var(--accent); }
    .tablist [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 3px solid var(--accent);
    }

    .panel-body { display: grid; gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .card h2, .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .card-sub { margin: 0 0 14px; font-size: 0.84rem; color: var(--muted); }

    /* Bars */
    .bar-list { display: grid; gap: 10px; }
    .bar-row { display: grid; gap: 5px; }
    .bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.84rem; }
    .bar-btn { text-align: left; background: none; border: none; padding: 0; color: var(--text); font-weight: 600; }
    .bar-btn:hover { color: var(--accent); text-decoration: underline; }
    .bar-track { height: 11px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }

    /* Timeline */
    .timeline-wrap { width: 100%; overflow-x: auto; }
    .timeline-tooltip { min-height: 22px; font-size: 0.84rem; color: var(--muted); margin-top: 8px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .sev-Critical, .prio-P0 { background: var(--critical-bg); color: var(--critical); }
    .sev-High, .prio-P1 { background: var(--high-bg); color: var(--high); }
    .sev-Medium, .prio-P2 { background: var(--medium-bg); color: var(--medium); }
    .sev-Low, .prio-P3 { background: var(--low-bg); color: var(--low); }

    /* Forms & Toolbars */
    .filter-toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 16px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 11px;
    }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .input, .select {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
    }
    .input { flex: 1 1 220px; }
    .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill-btn {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 0.81rem;
      font-weight: 600;
    }
    .pill-btn[aria-pressed="true"] { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    html[data-theme="dark"] .pill-btn[aria-pressed="true"] { color: #081226; }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--surface-alt); font-size: 0.77rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); white-space: nowrap; }
    tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Interactive Prioritization & Action Board */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
      gap: 18px;
      align-items: start;
    }
    .board-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .board-col-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .drop-list {
      position: relative;
      display: grid;
      gap: 10px;
      min-height: 220px;
      padding: 6px 2px;
      border-radius: 10px;
      transition: background 0.15s ease, outline-color 0.15s ease;
    }
    .drop-list.drop-target-hover {
      background: color-mix(in srgb, var(--accent-soft) 65%, transparent);
      outline: 2px dashed var(--drop-color);
    }
    .task-card {
      position: relative;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      transition: box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .task-card.is-dragging { opacity: 0.55; box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
    .task-card.is-done { opacity: 0.72; }
    .task-card.is-done .task-title { text-decoration: line-through; }

    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .drag-handle:hover, .drag-handle:focus-visible { color: var(--accent); background: var(--accent-soft); }

    .task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
    .task-title { font-weight: 700; font-size: 0.9rem; margin: 0 0 4px; }
    .task-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .score-chip {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .mini-select {
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.76rem;
    }

    /* Accordions & Templates */
    .accordion-stack { display: grid; gap: 10px; }
    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      box-shadow: var(--shadow);
    }
    summary { font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    details[open] summary { margin-bottom: 10px; color: var(--accent); }
    .why-list { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 0.89rem; }

    pre.template-box {
      margin: 10px 0;
      padding: 12px 14px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 0.87rem;
      line-height: 1.55;
    }

    /* Native Dialog */
    dialog {
      max-width: 720px;
      width: calc(100vw - 32px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      padding: 20px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
    }
    dialog:modal { overscroll-behavior: contain; }
    dialog::backdrop {
      background: rgba(10, 15, 28, 0.6);
      backdrop-filter: blur(2px);
      overflow: hidden;
      overscroll-behavior: contain;
    }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .dialog-head h2 { margin: 0; font-size: 1.12rem; }
    blockquote.verbatim-box {
      margin: 10px 0;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      background: var(--surface-alt);
      border-radius: 6px;
      font-size: 0.91rem;
      white-space: pre-wrap;
    }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; font-size: 0.83rem; margin-bottom: 12px; }
    .meta-pill { background: var(--surface-alt); padding: 8px 11px; border-radius: 8px; }

    /* Theme Knowledge Graph */
    .kg-wrap { width: 100%; overflow-x: auto; }
    .kg-svg { display: block; width: 100%; min-width: 720px; height: auto; }
    .kg-edge { fill: none; transition: opacity 0.18s ease, stroke-width 0.18s ease; }
    .kg-node { cursor: pointer; transition: opacity 0.18s ease; }
    .kg-node:focus-visible circle { stroke: var(--text); stroke-width: 3px; }
    .kg-dim { opacity: 0.16; }
    .kg-active { opacity: 1; }
    .kg-readout {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--surface-alt);
      font-size: 0.83rem;
      color: var(--muted);
      min-height: 36px;
    }

    footer { margin-top: 30px; font-size: 0.8rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1 id="hdr-title">IELTS British Council Indonesia — Meta Threads Crisis Intelligence</h1>
        <p class="subtitle" id="hdr-subtitle"></p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-info" id="open-methodology"></button>
        <div class="lang-switch" role="group" aria-label="Language selector">
          <button type="button" class="lang-btn" id="lang-id" data-lang="id" aria-pressed="true">ID</button>
          <button type="button" class="lang-btn" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="btn" id="theme-toggle"></button>
        <button type="button" class="btn btn-primary" id="export-csv"></button>
      </div>
    </div>
  </header>

  <main class="container">
    <section aria-label="KPI Summary" class="kpi-grid" id="kpi-grid"></section>

    <div class="tablist" role="tablist" aria-label="Analysis Navigation">
      <button type="button" role="tab" id="tab-overview" aria-selected="true"></button>
      <button type="button" role="tab" id="tab-explorer" aria-selected="false"></button>
      <button type="button" role="tab" id="tab-themes" aria-selected="false"></button>
      <button type="button" role="tab" id="tab-rca" aria-selected="false"></button>
      <button type="button" role="tab" id="tab-board" aria-selected="false"></button>
      <button type="button" role="tab" id="tab-marcomm" aria-selected="false"></button>
    </div>

    <p id="live-status" role="status" class="visually-hidden"></p>

    <!-- PANEL 1: OVERVIEW -->
    <section role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" tabindex="0">
      <div class="panel-body">
        <article class="card" id="methodology-banner"></article>
        <div class="grid-2">
          <article class="card">
            <h2 id="ov-sev-title"></h2>
            <p class="card-sub" id="ov-sev-sub"></p>
            <div class="bar-list" id="chart-severity"></div>
          </article>
          <article class="card">
            <h2 id="ov-sent-title"></h2>
            <p class="card-sub" id="ov-sent-sub"></p>
            <div class="bar-list" id="chart-sentiment"></div>
          </article>
        </div>

        <article class="card">
          <h2 id="ov-tl-title"></h2>
          <p class="card-sub" id="ov-tl-sub"></p>
          <div class="timeline-wrap" id="timeline-chart"></div>
          <div class="timeline-tooltip" id="timeline-tooltip" aria-live="polite"></div>
        </article>

        <div class="grid-2">
          <article class="card">
            <h2 id="ov-cat-title"></h2>
            <p class="card-sub" id="ov-cat-sub"></p>
            <div class="bar-list" id="chart-categories"></div>
          </article>
          <article class="card">
            <h2 id="ov-br-title"></h2>
            <p class="card-sub" id="ov-br-sub"></p>
            <div id="branch-list" class="bar-list"></div>
          </article>
        </div>
      </div>
    </section>

    <!-- PANEL 2: EXPLORER -->
    <section role="tabpanel" id="panel-explorer" aria-labelledby="tab-explorer" hidden>
      <div class="panel-body">
        <search>
          <form class="filter-toolbar" id="filter-form">
            <div class="filter-row">
              <label for="q" class="subtitle" style="font-weight:600;" id="exp-search-lbl"></label>
              <input id="q" class="input" type="search">
              <select id="filter-theme" class="select" aria-label="Filter Theme"></select>
              <select id="filter-sentiment" class="select" aria-label="Filter Sentiment"></select>
              <select id="sort-by" class="select" aria-label="Sort By"></select>
            </div>
            <div class="filter-row" style="justify-content: space-between;">
              <div class="pill-group" role="group" aria-label="Severity Filter" id="sev-pills">
                <button type="button" class="pill-btn" data-sev="ALL" aria-pressed="true"></button>
                <button type="button" class="pill-btn" data-sev="Critical" aria-pressed="false">Critical (6)</button>
                <button type="button" class="pill-btn" data-sev="High" aria-pressed="false">High (15)</button>
                <button type="button" class="pill-btn" data-sev="Medium" aria-pressed="false">Medium (16)</button>
                <button type="button" class="pill-btn" data-sev="Low" aria-pressed="false">Low (18)</button>
              </div>
              <div style="display:flex; gap:10px; align-items:center;">
                <span id="result-count" class="subtitle" style="font-weight:600;"></span>
                <button type="button" class="btn" id="reset-filters"></button>
              </div>
            </div>
          </form>
        </search>

        <article class="card" id="kg-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
            <div>
              <h2 id="kg-title" style="margin:0 0 4px;"></h2>
              <p class="card-sub" id="kg-sub" style="margin:0;"></p>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button type="button" class="pill-btn kg-mode-btn" data-kgmode="venue" aria-pressed="true" id="kg-mode-venue"></button>
              <button type="button" class="pill-btn kg-mode-btn" data-kgmode="actors" aria-pressed="false" id="kg-mode-actors"></button>
            </div>
          </div>
          <div class="kg-wrap" id="kg-container"></div>
          <div class="kg-readout" id="kg-readout" aria-live="polite"></div>
        </article>

        <div class="table-wrap">
          <table>
            <thead id="explorer-thead"></thead>
            <tbody id="explorer-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- PANEL 3: THEMATIC ANALYSIS -->
    <section role="tabpanel" id="panel-themes" aria-labelledby="tab-themes" hidden>
      <div class="panel-body">
        <div class="grid-2" id="themes-grid"></div>
      </div>
    </section>

    <!-- PANEL 4: RCA (5 WHYS & FISHBONE) -->
    <section role="tabpanel" id="panel-rca" aria-labelledby="tab-rca" hidden>
      <div class="panel-body" id="rca-container"></div>
    </section>

    <!-- PANEL 5: INTERACTIVE PRIORITIZATION & ACTION BOARD -->
    <section role="tabpanel" id="panel-board" aria-labelledby="tab-board" hidden>
      <div class="panel-body">
        <search>
          <form class="filter-toolbar" id="board-filter-form">
            <div class="filter-row">
              <label for="board-q" class="subtitle" style="font-weight:600;" id="brd-filter-lbl"></label>
              <input id="board-q" class="input" type="search">
              <select id="board-fn" class="select" aria-label="Filter Function"></select>
              <select id="board-prio" class="select" aria-label="Filter Priority"></select>
              <button type="button" class="btn btn-primary" id="sort-by-score"></button>
            </div>
            <div class="filter-row" style="justify-content:space-between;">
              <div class="filter-row" style="flex:1 1 auto;">
                <input id="new-task-title" class="input" type="text" style="max-width:340px;">
                <select id="new-task-fn" class="select" aria-label="New Task Function"></select>
                <button type="button" class="btn" id="add-task-btn"></button>
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" class="btn" id="export-plan-csv"></button>

  <script>
    const DATA = {"items": [{"id": "P0-01", "severity": "Critical", "priority": "P0", "recordType": "Original Post", "recordType_en": "Original Post", "category": "Viral Boycott / Systemic Scoring Allegation", "category_en": "Viral Boycott / Systemic Scoring Allegation", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-24 08:05", "day": "2026-11-24", "handle": "@qhajarahmad", "venue": "Jakarta, Jogja, Bandung (umum BC Indonesia)", "views": 147000, "likes": 2200, "replies": 548, "reposts": 214, "summary": "Pengajar IELTS umumkan berhenti rekomendasikan BC karena pola penilaian Writing & Speaking dinilai merugikan 3-4 bulan terakhir.", "summary_en": "IELTS instructor announces halting BC recommendations over perceived abnormal & disadvantageous Writing/Speaking scoring patterns over the past 3–4 months.", "verbatim": "Dengan menyesal, mulai hari ini, Selasa Kliwon, tanggal 24 November 2026, saya tidak akan merekomendasikan murid-murid saya untuk ambil tes IELTS di BC. Saya merasa ada pola yang aneh (dan merugikan peserta) dalam penilaian writing dan speaking sejak 3-4 bulan terakhir. Kalau ada yg tes di BC dan merasakan hal yang sama,.boleh komen atau DM ya, krn saya juga masih mengumpulkan data.", "verbatim_en": "With regret, starting today, Tuesday Kliwon, November 24, 2026, I will no longer recommend my students to take the IELTS test at BC. I feel there is a strange (and candidate-harming) pattern in writing and speaking scoring over the last 3–4 months. If anyone tested at BC and felt the same, feel free to comment or DM as I am still collecting data.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P0-02", "severity": "Critical", "priority": "P0", "recordType": "Original Post", "recordType_en": "Original Post", "category": "Viral Boycott / Systemic Scoring Allegation", "category_en": "Viral Boycott / Systemic Scoring Allegation", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-23 21:23", "day": "2026-11-23", "handle": "@kholidiaalifahmei", "venue": "BC Indonesia (tidak spesifik cabang)", "views": 38700, "likes": 614, "replies": 122, "reposts": 37, "summary": "Tidak rekomendasikan tes di BC; mengalami retake Speaking (2x hingga part 3) dengan hasil lebih rendah dari mock test.", "summary_en": "Strongly advises against taking IELTS at BC; experienced forced Speaking retake (twice up to Part 3) with worse score than 4 mentors' mock predictions.", "verbatim": "Sangat tidak merekomendasikan ambil tes di British Council. It’s only my opinion. Ini bisa gak sih minta hasil penilaian speaking sekaligus koreksian mereka secara detail? Mahal loh udah bayar gede in this economy. Temen-temn di sini yang punya keresahan yang sama mungkin di BC? Boleh dong ceritain.", "verbatim_en": "Strongly do not recommend taking the test at British Council. It’s only my opinion. Is it possible to request detailed speaking scoring and corrections? It’s expensive paying so much in this economy. Friends here who share the same concern about BC? Please share your stories.", "url": "https://www.threads.com/@kholidiaalifahmei/post/DgFllUkkYJt"}, {"id": "P0-03", "severity": "Critical", "priority": "P0", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Writing & Speaking Scoring / EOR Overturn", "category_en": "Writing & Speaking Scoring / EOR Overturn", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-24 18:55", "day": "2026-11-24", "handle": "@ddokiii", "venue": "BC Indonesia (Okt 2023)", "views": null, "likes": 234, "replies": 6, "reposts": 5, "summary": "Speaking Zoom lag diabaikan pengawas, hasil telat, Writing 6.0 naik jadi 6.5 setelah bayar EOR Rp2 juta (vs IALF overall 8.0).", "summary_en": "Zoom Speaking lag ignored by proctor, delayed results, Writing 6.0 overturned to 6.5 after paying Rp2M EOR (while scoring 8.0 overall at IALF).", "verbatim": "Speakingnya pake Zoom dan sinyalnya jelek, pas aku protes berkali-kali, kang jaganya bilang \"asal kedengeran mah gakpapa gausah ganti walaupun videonya lagging\"... Hasilnya keluar TELAT... Pas liat Writing nya 6.0 aku langsung bayar 2 Juta buat \"TOLONG CEK ULANG!\"... Seminggu setelahnya, review ulang Writing keluar. Nilaiku berubah 6.5 jadi uangku dibalikin...", "verbatim_en": "Speaking used Zoom and the connection was bad; when I protested repeatedly, the proctor said 'as long as it's audible it's fine, no need to switch even if the video is lagging'... Results came out LATE... Seeing Writing 6.0 I immediately paid 2 Million for 'PLEASE RE-CHECK!'... A week later, the Writing review came out. My score changed to 6.5 so my money was refunded...", "url": "https://www.threads.com/@ddokiii/post/DgH5ZRlExFG"}, {"id": "P0-04", "severity": "Critical", "priority": "P0", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24 08:31", "day": "2026-11-24", "handle": "@uswa_aftah", "venue": "BC Indonesia (2025)", "views": 83, "likes": null, "replies": 2, "reposts": null, "summary": "Rekaman Speaking teman bermasalah hingga diminta tes ulang di semua skill (bukan hanya Speaking).", "summary_en": "Friend's 2025 BC Speaking recording had an issue and the candidate was asked to retake all four skills.", "verbatim": "Temenku pernah ngambil test di BC tahun 2025 kak. Ternyata rekaman pas speakingnya bermasalah. Diminta untuk tes ulang di semua skill😭😭", "verbatim_en": "My friend took the test at BC in 2025. Turns out the speaking recording had an issue. They were asked to retake the test across all skills😭😭", "url": "https://www.threads.com/@uswa_aftah/post/DgGx7t8EnlK"}, {"id": "P0-05", "severity": "Critical", "priority": "P0", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Result / Certificate Delay & Verification", "category_en": "Result / Certificate Delay & Verification", "theme": "T4: Result Delays & Verification Friction", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@ydharma", "venue": "BC Indonesia (tes 14 Nov 2026)", "views": null, "likes": 1, "replies": null, "reposts": null, "summary": "Hasil tes IELTS anak tanggal 14 Nov 2026 belum keluar sementara teman seangkatan sudah keluar; sudah bolak-balik diurus.", "summary_en": "Child took IELTS on Nov 14, 2026 and results remain unreleased while peers already received theirs despite repeated follow-ups.", "verbatim": "Anak saya ambil ujian IELTS tgl 14 nov kmrn, hasilnya belum keluar. Temannya yg barengan sudah keluar. Bulak balik urus belum ada hasil", "verbatim_en": "My child took the IELTS exam on Nov 14, and the result hasn't come out yet. Their friend who took it together already got theirs. Went back and forth handling it with no result yet.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P0-06", "severity": "Critical", "priority": "P0", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Writing & Speaking Scoring / EOR Overturn", "category_en": "Writing & Speaking Scoring / EOR Overturn", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@uusmayantivivi", "venue": "BC Bandung (akhir 2022)", "views": null, "likes": 4, "replies": 1, "reposts": null, "summary": "Banding/remark berbayar (~Rp1,8 juta) menaikkan skor Speaking +1.0 dan Writing +0.5 di BC Bandung.", "summary_en": "Paid remark/appeal (~Rp1.8M) at BC Bandung (late 2022) raised Speaking by +1.0 and Writing by +0.5.", "verbatim": "Akuu punya pengalaman tidak mengenalkan sama BC Bandung. Tahun 2022 akhir test disana... Trus aku banding- remark (dengan bayar setengah harga, kisaran 1.8 jutaan kalo ga salah). Nilaiku naik 1 poin untuk speaking, dan writing 0.5 point 😂😂😂.", "verbatim_en": "I had an unpleasant experience with BC Bandung. Late 2022 tested there... Then I appealed/remarked (paying half price, around 1.8 million if I recall). My score went up 1 point for speaking, and 0.5 point for writing 😂😂😂.", "url": "https://www.threads.com/@kholidiaalifahmei/post/DgFllUkkYJt"}, {"id": "P1-07", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@ayuabece", "venue": "BC Yogyakarta (~19 Nov 2026)", "views": null, "likes": 84, "replies": 7, "reposts": 6, "summary": "Sinyal Speaking jelek di BC Jogja sehingga tes ditunda & diganti penguji India dengan aksen sulit dipahami; skor S & W rendah.", "summary_en": "Poor signal during Speaking at BC Yogyakarta (~Nov 19, 2026) forced delay & switch to an Indian examiner whose accent felt hard to follow; low S & W scores.", "verbatim": "Aku baru aja selesai 5 hari yg lalu di BC Yogya. Speaking saya rendah nilainya, writing apalagi. Parahnya, di speaking itu sinyalnya sempet jelek jadi tesnya ditunda. Diganti beberapa lama kemudian, dg examiner India, yg astaga aksennya sangat tdk fair sekali menurutku.", "verbatim_en": "I just finished 5 days ago at BC Yogya. My speaking score was low, writing even worse. Worse, during speaking the signal was bad so the test was delayed. Replaced some time later with an Indian examiner, whose accent was honestly very unfair in my view.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P1-08", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Test Center Hardware, Audio & Staff Conduct", "category_en": "Test Center Hardware, Audio & Staff Conduct", "theme": "T3: Hardware, Acoustics & Staff Conduct", "sentiment": "Negative", "date": "2026-11-25 16:40", "day": "2026-11-25", "handle": "@vanilllaaaes", "venue": "BC Indonesia (~11 Nov 2026)", "views": null, "likes": null, "replies": null, "reposts": null, "summary": "Layar tes gelap/tidak bisa diatur kontras, staf tidak sopan menaruh headset ke kepala, dan audio Speaking kecil.", "summary_en": "Dark monitor with unadjustable contrast, staff rudely placed headset onto candidate's head, and low Speaking audio volume (~Nov 11, 2026).", "verbatim": "Aku juga 2 minggu yg lalu tes di BC dan ga worth it banget, dapat layar yg kontras cahayanya gelap banget tapi ga bisa ditingkatin cahayanya... Pas nanya tukang jaganya ehh bukannya ngejawab tapi cuma disuruh lihat video dan ga sopan banget langsung naruh headset di kepala gue... pas speaking suaranya kecil... malah suara gue yg disuruh dikencangin", "verbatim_en": "I also tested at BC 2 weeks ago and it was so not worth it, got a screen whose light contrast was very dark but couldn't be brightened... When asking the proctor, instead of answering they just told me to watch a video and rudely put the headset directly on my head... during speaking the voice was quiet... instead my voice was told to be louder.", "url": "https://www.threads.com/@vanilllaaaes/post/DgKOsYdE_xD"}, {"id": "P1-09", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@anggilani", "venue": "BC Indonesia", "views": null, "likes": 13, "replies": 2, "reposts": null, "summary": "Speaking computer-based terputus di 70% karena koneksi, disambung ke penguji lain yang ketus & memotong; skor turun dari 6.5 ke 6.", "summary_en": "Computer-based Speaking disconnected at ~70% due to connection issues, reconnected with a different curt examiner who interrupted; score dropped 6.5 to 6.0.", "verbatim": "Pas speaking kira2 udah 70%an kelar, tiba2 gangguan koneksi, trus pas connect lg sm beda orang. Trus aku ngomong dipotong mulu trus agak ketus pdhl kan harusnya yg ketus aku krn udh bayar malah jd kerja 2x. Hasilnya pas cuman 6 (turun dari 6.5 di tes sebelumnya)", "verbatim_en": "During speaking when it was ~70% done, suddenly connection disrupted, then reconnected with a different person. Then I kept getting cut off and they were rather curt when I'm the one who paid and had to work twice. Result was only 6 (down from 6.5 in previous test).", "url": "https://www.threads.com/@kholidiaalifahmei/post/DgFllUkkYJt"}, {"id": "P1-10", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@dreamingdreamy_", "venue": "BC Bandung (2025)", "views": null, "likes": 6, "replies": 2, "reposts": null, "summary": "Harus tes Speaking 2 kali di BC Bandung karena sesi pertama gagal terekap skornya; dikejar petugas setelah keluar.", "summary_en": "Had to take Speaking twice at BC Bandung (2025) because the first session's score failed to record; chased by staff after exiting.", "verbatim": "Kak, aku di BC bandung, 2025 lalu, Speaking 2 kali, krn yg pertama ga berhasil direkap scorenya katanya! Dikejar lagi sama Mas-masnya pas aku udah di luar buat tes speaking lagi😭", "verbatim_en": "At BC Bandung, back in 2025, did Speaking twice, because the first one failed to record the score they said! Chased by the staff member when I was already outside to redo the speaking test😭", "url": "https://www.threads.com/@kholidiaalifahmei/post/DgFllUkkYJt"}, {"id": "P1-11", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@odilapaskaa", "venue": "BC Indonesia", "views": null, "likes": 5, "replies": 1, "reposts": null, "summary": "Sinyal petugas Speaking jelek sehingga harus stop & mengulang tes; peserta sempat disalahkan sebelum terbukti sinyal petugas bermasalah.", "summary_en": "Examiner's Speaking signal was poor forcing a stop and restart; candidate was initially blamed before proving the test center's signal was at fault.", "verbatim": "Kakkk aku pernah lagi lagi test speaking sinyal si petugasnya jelek. Jdi aku minta stop trus ngulang test. Kesel bgt jdi udh ga optimal krn aku jg udh stress dibilang sinyal di indo yg jelek dan aku mengada ngada. Jdi ku panggil itu yg jaga test & emang bener sinyal mereka yg jelek.", "verbatim_en": "Once during my speaking test the staff/examiner signal was bad. So I asked to stop and restart. So annoyed it wasn't optimal anymore because I was stressed being told Indonesian signal is bad and that I was making things up. So I called the proctor & indeed their signal was the bad one.", "url": "https://www.threads.com/@ddokiii/post/DgH5ZRlExFG"}, {"id": "P1-12", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@safirayusinta", "venue": "BC Jakarta (2023)", "views": null, "likes": 1, "replies": 1, "reposts": null, "summary": "Kendala device/koneksi menunda tes Speaking ~2 jam di BC Jakarta; penguji memotong jawaban & skor tak sesuai latihan.", "summary_en": "Device/connection issue at BC Jakarta (2023) delayed Speaking ~2 hours; examiner cut off answers & score missed practice level; switched to IDP.", "verbatim": "Pernah ambil Ielts di BC Jkt tahun 2023. Waktu speaking test, device atau koneksi dari akunku bermasalah, dan cuma aku aja yang bermasalah, sampai menunda sekitar 2 jam. Ketika udah berhasil masuk, pengujinya orang India dan ketika aku kash jawaban belum selesai langsung dipotong... Akhirnya pindah ke IDP aja dan alhamdulillah semuanya mulus", "verbatim_en": "Took IELTS at BC Jkt in 2023. During speaking test, my account's device or connection had issues, only mine, delaying around 2 hours. When I finally got in, the examiner was Indian and before I finished answering I got cut off... Eventually moved to IDP and thank God everything went smoothly.", "url": "https://www.threads.com/@kholidiaalifahmei/post/DgFllUkkYJt"}, {"id": "P1-13", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Test Center Hardware, Audio & Staff Conduct", "category_en": "Test Center Hardware, Audio & Staff Conduct", "theme": "T3: Hardware, Acoustics & Staff Conduct", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@nadyameriza", "venue": "BC Indonesia", "views": null, "likes": 1, "replies": null, "reposts": null, "summary": "Headset bocor saat Listening hingga audio terdistraksi peserta sebelah; sudah protes namun tidak bisa ulang.", "summary_en": "Leaking headset during Listening caused audio bleed from adjacent candidate; protested but could not retake.", "verbatim": "Saya pernah dapet headset bocor bikin terdistraksi saat listening. Audio saya kejar2an dengan yg di sebelah. Udah protes gak bisa ulang.", "verbatim_en": "I once got a leaking headset that distracted me during listening. My audio clashed with the person next to me. Already protested, couldn't retake.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P1-14", "severity": "High", "priority": "P1", "recordType": "Original Post", "recordType_en": "Original Post", "category": "Result / Certificate Delay & Verification", "category_en": "Result / Certificate Delay & Verification", "theme": "T4: Result Delays & Verification Friction", "sentiment": "Negative", "date": "2026-11-02 10:55", "day": "2026-11-02", "handle": "@cassandra_renata", "venue": "BC Indonesia", "views": 1100, "likes": 2, "replies": 6, "reposts": null, "summary": "Sertifikat IELTS BC berstatus 'has not been verified yet' pada aplikasi beasiswa (eligible under condition).", "summary_en": "BC IELTS certificate showed 'has not been verified yet' on a scholarship application (eligible under condition), triggering verification anxiety.", "verbatim": "Guys ada yg bisa cek apakah sertifikat ielts aku bisa diverify/ engga? Aku tes di british council lgsg, trsss aplikasi beasiswa aku eligible under condition karena ieltsnya has not been verified yet. Parno aja gt takut gak bisa di verify😭🥲", "verbatim_en": "Guys can anyone check if my IELTS certificate can be verified or not? I tested directly at British Council, and my scholarship application is eligible under condition because the IELTS has not been verified yet. Just paranoid it won't verify😭🥲", "url": "https://www.threads.com/@cassandra_renata/post/DfOY_eXmfA5"}, {"id": "P1-15", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Writing & Speaking Scoring / EOR Overturn", "category_en": "Writing & Speaking Scoring / EOR Overturn", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@xabrown", "venue": "BC Indonesia", "views": null, "likes": 56, "replies": 1, "reposts": null, "summary": "Ketimpangan skor Writing 5.5 di BC padahal L/R/S 7.5 dan sebelumnya di IDP/IALF Writing tidak pernah di bawah 6.", "summary_en": "Sharp discrepancy: Writing 5.5 at BC despite L/R/S at 7.5 and never scoring below 6.0 in prior IDP/IALF tests.", "verbatim": "kak, aku pernah dua kali take ielts di IDP sm IALF, writing ga pernah di bawah 6. trs terakhir aku coba di BC dan udah persiapan cukup mantap, turns out writing ku 5.5. pdhl LRS udh 7.5. ky nonsense, cm yaudah😔", "verbatim_en": "I took IELTS twice at IDP and IALF, writing was never below 6. Then recently I tried BC with solid preparation, turns out my writing was 5.5 even though LRS were 7.5. Like nonsense, but oh well😔", "url": "https://www.threads.com/@kholidiaalifahmei/post/DgFllUkkYJt"}, {"id": "P1-16", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Writing & Speaking Scoring / EOR Overturn", "category_en": "Writing & Speaking Scoring / EOR Overturn", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@n.qurrotuainii", "venue": "BC Indonesia (tes pertama)", "views": null, "likes": 112, "replies": 8, "reposts": 4, "summary": "Hasil tes pertama di BC jauh di bawah latihan; teknis wawancara Speaking dengan penguji India dinilai berbeda.", "summary_en": "First-time BC test results far below mock scores; noted online Speaking with Indian examiner felt technically different from prep classes.", "verbatim": "aku kmrn tes pertama kali di BC 🥲 sumpah kaget bgt hasilnya jauh di bawah latihan2ku. btw speaking int nya sama org India, mana beda bgt teknisnya sama yg di video study/class", "verbatim_en": "Just tested for the first time at BC 🥲 honestly shocked the result was far below my practice scores. btw speaking interview was with an Indian examiner, and technically very different from study/class videos.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {" reposts": 3, "summary": "Menyebut isu BC sudah terdengar sejak 2019; lebih memilih IDP/IALF untuk murid persiapan beasiswa.", "summary_en": "Educator notes similar rumors since 2019 and prefers IDP or IALF for scholarship and university registration prep.", "verbatim": "Sepertinya isu ini bukan hal yg baru, sy udh denger ada dugaan ini sejak tahun 2019. Mknya waktu bimbingan intensif n tes IELTS utk persiapan beasiswa n registrasi univ LN, sy prefer pke IDP atau IALF.", "verbatim_en": "Seems this issue isn't new, I've heard these allegations since 2019. That's why during intensive prep & IELTS tests for scholarships and overseas uni registration, I prefer IDP or IALF.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P1-21", "severity": "High", "priority": "P1", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Viral Boycott / Systemic Scoring Allegation", "category_en": "Viral Boycott / Systemic Scoring Allegation", "theme": "T1: Scoring Opacity, Bias & EOR Discrepancies", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@gustirapahlevi", "venue": "BC Indonesia", "views": null, "likes": 62, "replies": 3, "reposts": 3, "summary": "Pengajar menyebut mengarahkan murid ke IDP/IALF kecuali terpaksa karena menilai BC sejak dulu bermasalah.", "summary_en": "Instructor states steering students toward IDP/IALF unless forced, viewing BC as problematic long-term.", "verbatim": "Dari dulu BC udah aneh kak.. aku sebisa mungkin arahin murid2ku untuk ambil di IDP/IALF kecuali terpaksa..", "verbatim_en": "BC has always been weird.. I try as much as possible to direct my students to take it at IDP/IALF unless forced..", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P2-22", "severity": "Medium", "priority": "P2", "recordType": "Original Post", "recordType_en": "Original Post", "category": "Pre-Test Anxiety / Booking Hesitation", "category_en": "Pre-Test Anxiety / Booking Hesitation", "theme": "T5: Viral Contagion, Anxiety & Competitor Spillover", "sentiment": "Anxious / Mixed", "date": "2026-11-24", "day": "2026-11-24", "handle": "@thriveward", "venue": "BC Indonesia", "views": 4800, "likes": 81, "replies": 25, "reposts": 2, "summary": "Peserta sudah daftar tes tgl 23 merasa takut dan khawatir karena puluhan postingan Threads tidak merekomendasikan BC.", "summary_en": "Booked for Nov 23 test feels anxious after seeing dozens of Threads posts advising against BC.", "verbatim": "Lagi rame isu British Council kayaknya ya, udah lewat beberapa kali dan puluhan orang dari beberapa post tidak merekomendasikannya. Saya udah daftar buat tgl 23, semoga aja aman... Takut banget sebenernya. 😅😅", "verbatim_en": "British Council issues seem to be trending, saw it several times and dozens of people across posts don't recommend it. I already registered for the 23rd, hope it's safe... Actually super scared. 😅😅", "url": "https://www.threads.com/@thriveward/post/DgG8z1RGMFf"}, {"id": "P2-23", "severity": "Medium", "priority": "P2", "recordType": "Original Post", "recordType_en": "Original Post", "category": "Pre-Test Anxiety / Booking Hesitation", "category_en": "Pre-Test Anxiety / Booking Hesitation", "theme": "T5: Viral Contagion, Anxiety & Competitor Spillover", "sentiment": "Anxious / Mixed", "date": "2026-11-24 18:17", "day": "2026-11-24", "handle": "@fudreee", "venue": "BC Indonesia", "views": 2400, "likes": 8, "replies": 12, "reposts": null, "summary": "Peserta yang sudah terlanjur booking BC untuk tes pertama menjadi insecure akibat ulasan negatif di Threads.", "summary_en": "Already booked BC for first IELTS test and feels insecure reading negative Threads reviews.", "verbatim": "udah terlanjur book BC untuk test ielts pertamaku, terus muncul review2 tentang BC yang bikin insecure bgttt 😞😞😞", "verbatim_en": "Already booked BC for my first IELTS test, then reviews about BC popped up making me super insecure 😞😞😞", "url": "https://www.threa ian examiner... made me mentally down🥲 Oh I tested in Sby.", "url": "https://www.threads.com/@qhajarahmad/post/DgGvBBek2vs"}, {"id": "P2-35", "severity": "Medium", "priority": "P2", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Test Center Hardware, Audio & Staff Conduct", "category_en": "Test Center Hardware, Audio & Staff Conduct", "theme": "T3: Hardware, Acoustics & Staff Conduct", "sentiment": "Negative", "date": "2026-11-25", "day": "2026-11-25", "handle": "@dawnworldsz", "venue": "BC Indonesia", "views": null, "likes": null, "replies": null, "reposts": null, "summary": "Mengeluhkan aturan wajib pakai headset pada Speaking online BC yang tidak diinformasikan sebelumnya.", "summary_en": "Complains that mandatory headset usage during BC's online Speaking test was not disclosed beforehand.", "verbatim": "BC itu speaking test nya via online kak, udah gitu wajib pakai headset, ga bisa ga pakai, jadi buat yang ga terbiasa pakai headset pas speaking test berasa ga nyaman, dan itu mereka ga kasih tau!! 😭", "verbatim_en": "BC speaking test is online, and you must wear a headset, can't go without it, so for those unused to wearing a headset during speaking it feels uncomfortable, and they didn't tell us!! 😭", "url": "https://www.threads.com/@thriveward/post/DgG8z1RGMFf"}, {"id": "P2-36", "severity": "Medium", "priority": "P2", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Speaking Online Tech / Forced Retake", "category_en": "Speaking Online Tech / Forced Retake", "theme": "T2: Online Speaking Fragility & Forced Retakes", "sentiment": "Negative", "date": "2026-11-24", "day": "2026-11-24", "handle": "@travelmom.id", "venue": "BC Indonesia", "views": null, "likes": 2, "replies": 1, "reposts": null, "summary": "Mengalami Speaking via Zoom yang ngelag tetapi takut mengajukan komplain.", "summary_en": "Experienced lagging Zoom Speaking test at BC but was afraid to complain.", "verbatim": "Kak sumpahhh aku juga kzl bgt tesnya pake zoom dan ngelaggg. Mau komplen takut salahhh 😭😭", "verbatim_en": "I was also so annoyed the test used Zoom and lagged. Wanted to complain but afraid of being wrong 😭😭", "url": "https://www.threads.com/@ddokiii/post/DgH5ZRlExFG"}, {"id": "P2-37", "severity": "Medium", "priority": "P2", "recordType": "Reply / Testimony", "recordType_en": "Reply / Testimony", "category": "Test Center Hardware, Audio & Staff Conduct", "category_en": "Test Center Hardware, Audio & Staff Conduct", "theme": "T3: Hardware, Acoustics & Staff Conduct", "sentiment": "Negative", "date": "2026-11-10", "day": "2026-11-10", "handle": "@impiecka", "venue": "UPT Bahasa Unimed (Medan)", "views": 3600, "likes": 57, "replies": 21, "reposts": null, "summary": "Kecewa hasil Listening Juli lalu (persiapan 3 minggu) dan mencatat ruangan tes di Unimed tidak memakai sekat.", "summary_en": "Disappointed with July Listening score (3 weeks prep) and notes UPT Bahasa Unimed room lacked desk partitions.", "verbatim": "July lalu aku ambil tes IELTS pertamaku di British Council dengan persiapan cuma kurang lebih 3 minggu. Ternyata hasilnya kurang memuaskan, terutama di listening lol😭 ... di UPT Bahasa Unimed, seingetku gaada sekatnya", "verbatim_en": "Last July I took my first IELTS test at British Council with only ~3 weeks prep. Result was disappointing, especially listening lol😭 ... at UPT Bahasa Unimed, as I recall there were no partitions.", "url": "https://www.threads.com/@impiecka/post/Dfi_5Z_IeYD"}, {"id": "P3-38", "severity": "Low", "priority": "P3", "recordType": "Original Post", "recordType_en": "Original Post", "category": "Neutral Comparison / Inquiry / Info", "category_en": "Neutral Comparison / Inquiry / Info", "theme": "T6: Counter-Narratives & Neutral Comparisons", "sentiment": "Neutral / Info", "date": "2026-11-23 18:09", "day": "2026-11-23", "handle": "@raraalmm", "venue": "IDP -> mempertimbangkan BC", "views": 6300, "likes": 96, "replies": 40, "reposts": 5, "sum     function activateTab(targetTab, moveFocus = false) {
      tabs.forEach((t, i) => {
        const selected = t === targetTab;
        t.setAttribute("aria-selected", String(selected));
        panels[i].hidden = !selected;
        if (selected) panels[i].setAttribute("tabindex", "0");
        else panels[i].removeAttribute("tabindex");
      });
      targetTab.scrollIntoView({ block: "nearest", inline: "nearest" });
      if (moveFocus) targetTab.focus();
    }

    tabs.forEach((tab, idx) => {
      tab.addEventListener("click", () => activateTab(tab));
      tab.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") activateTab(tabs[(idx + 1) % tabs.length], true);
        else if (e.key === "ArrowLeft") activateTab(tabs[(idx - 1 + tabs.length) % tabs.length], true);
        else if (e.key === "Home") activateTab(tabs[0], true);
        else if (e.key === "End") activateTab(tabs[tabs.length - 1], true);
      });
    });

    function renderKPIs() {
      const items = DATA.items;
      const t = I18N[lang];
      const critHigh = items.filter(i => i.severity === "Critical" || i.severity === "High").length;
      const negCount = items.filter(i => i.sentiment === "Negative").length;
      const posCount = items.filter(i => i.sentiment === "Positive / Counter-Narrative").length;
      const totalLikes = items.reduce((s, i) => s + (i.likes || 0), 0);
      const totalViews = items.reduce((s, i) => s + (i.views || 0), 0);

      const vals = [
        items.length,
        critHigh,
        `${negCount} vs ${posCount}`,
        `${(totalViews / 1000).toFixed(1)}K views`
      ];
      const metas = [
        t.kpi[0][1],
        `${((critHigh / items.length) * 100).toFixed(1)}% ${t.kpi[1][1]}`,
        `${((negCount / items.length) * 100).toFixed(1)}% ${t.kpi[2][1].split("|")[0]}| ${((posCount / items.length) * 100).toFixed(1)}% ${t.kpi[2][1].split("|")[1]}`,
        `${totalLikes.toLocaleString("en-US")} ${t.kpi[3][1]}`
      ];

      document.getElementById("kpi-grid").innerHTML = t.kpi.map(([lbl], i) => `
        <div class="kpi-card">
          <div class="kpi-label">${escapeHtml(lbl)}</div>
          <div class="kpi-value">${escapeHtml(vals[i])}</div>
          <div class="kpi-meta">${escapeHtml(metas[i])}</div>
        </div>
      `).join("");
    }

        return `
          <div class="bar-row">
            <div class="bar-head">
              <button type="button" class="bar-btn jump-sev" data-sev="${sev}">${sev} (${subset.length} ${lang === "en" ? "items" : "item"})</button>
              <span class="subtitle">${likes.toLocaleString("en-US")} likes${views ? ` · ${(views/1000).toFixed(1)}K views` : ""}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${(subset.length / maxSev) * 100}%; background:${SEV_COLORS[sev]}"></div></div>
          </div>
        `;
      }).join("");

      const sentOrder = ["Negative", "Positive / Counter-Narrative", "Neutral / Info", "Anxious / Mixed"];
      document.getElementById("chart-sentiment").innerHTML = sentOrder.map(sent => {
        const cnt = items.filter(i => i.sentiment === sent).length;
        const pct = (cnt / items.length) * 100;
        return `
          <div class="bar-row">
            <div class="bar-head">
              <button type="button" class="bar-btn jump-sent" data-sent="${sent}">${sent}</button>
              <span class="subtitle">${cnt} (${pct.toFixed(1)}%)</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${SENT_COLORS[sent]}"></div></div>
          </div>
        `;
      }).join("");

      const catCounts = {};
      items.forEach(i => { catCounts[i.category] = (catCounts[i.category] || 0) + 1; });
      const sortedCats = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
      const maxCat = sortedCats[0][1];
      document.getElementById("chart-categories").innerHTML = sortedCats.map(([cat, cnt]) => `
        <div class="bar-row">
          <div class="bar-head">
            <button type="button" class="bar-btn jump-cat" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
            <span class="subtitle">${cnt} ${lang === "en" ? "items" : "item"}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${(cnt/maxCat)*100}%; background:var(--accent)"></div></div>
        </div>
      `).join("");

      document.getElementById("branch-list").innerHTML = DATA.branches.map(b => `
        <div class="meta-pill">
          <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;">
            <strong>${escapeHtml(lang === "en" ? b.location_en : b.location)}</strong>
            <span class="badge ${b.risk.includes("Critical") ? "sev-Critical" : b.risk.includes("High") ? "sev-High" : "sev-Medium"}">${escapeHtml(b.risk)}</span>
          </div>
          <div class="subtitle">${escapeHtml(lang === "en" ? b.summary_en : b.summary)} <em>(${escapeHtml(lang === "en" ? b.coverage_en : b.coverage)})</em></div>
        </div>
      `).join("");

      const days = [];
      for (let d = 1; d <= 25; d++) {
        const key = `2026-11-${String(d).padStart(2, "0")}`;
        const dayItems = items.filter(i => i.day === key);
        days.push({
          key, label: `Nov ${d}`, count: dayItems.length,
          likes: dayItems.reduce((s, i) => s + (i.likes || 0), 0),
          crit: dayItems.filter(i => i.severity === "Critical").length,
          high: dayItems.filter(i => i.severity === "High").length,
          med: dayItems.filter(i => i.severity === "Medium").length,
          low: dayItems.filter(i => i.severity === "Low").length
        });
      }
      const w = 860, h = 210, padL = 36, padB = 28, padT = 18, padR = 16;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const maxCount = Math.max(...days.map(d => d.count), 1);
      const step = plotW / days.length, barW = step * 0.65;

      let svgBars = "";
      days.forEach((d, i) => {
        const x = padL + i * step + (step - barW) / 2;
        const barH = (d.count / maxCount) * plotH;
        const y = padT + plotH - barH;
        const fill = d.crit > 0 ? "var(--critical)" : d.high > 0 ? "var(--high)" : d.count > 0 ? "var(--accent)" : "var(--border)";
        const info = lang === "en"
          ? `${d.label}: ${d.count} items (${d.crit} Critical, ${d.high} High, ${d.med} Medium, ${d.low} Low) | ${d.likes.toLocaleString("en-US")} reported likes`
          : `${d.label}: ${d.count} item (${d.crit} Critical, ${d.high} High, ${d.med} Medium, ${d.low} Low) | ${d.likes.toLocaleString("en-US")} likes terlapor`;
        svgBars += `
          <g class="tl-day" tabindex="0" data-info="${escapeHtml(info)}">
            <rect x="${x.toFixed(1)}" y="${Math.min(y, padT + plotH - 2).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH, 2).toFixed(1)}" rx="3" fill="${fill}" />
            ${d.count > 0 ? `<text x="${(x + barW/2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">${d.count}</text>` : ""}
            ${(i % 2 === 0 || i === 24) ? `<text x="${(x + barW/2).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label.replace("Nov ", "")}</text>` : ""}
          </g>
        `;
      });
      document.getElementById("timeline-chart").innerHTML = `
        <svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Crisis escalation daily timeline Nov 1 to Nov 25, 2026">
          <line x1="${padL}" y1="${padT + plotH}" x2="${w - padR}" y2="${padT + plotH}" stroke="var(--border)" />
          ${svgBars}
        </svg>
      `;
      const tip = document.getElementById("timeline-tooltip");
      document.querySelectorAll(".tl-day").forEach(g => {
        const show = () => { tip.textContent = g.dataset.info; };
        g.addEventListener("mouseenter", show);
        g.addEventListener("focus", show);
      });

      document.querySelectorAll(".jump-sev").forEach(b => b.addEventListener("click", () => {
        setSeverityFilter(b.dataset.sev);
        activateTab(document.getElementById("tab-explorer"), true);
      }));
      document.querySelectorAll(".jump-sent").forEach(b => b.addEventListener("click", () => {
        state.sentiment = b.dataset.sent;
        document.getElementById("filter-sentiment").value = state.sentiment;
        renderExplorer();
        activateTab(document.getElementById("tab-explorer"), true);
      }));
      document.querySelectorAll(".jump-cat").forEach(b => b.addEventListener("click", () => {
        state.query = b.dataset.cat.split(" ")[0];
        document.getElementById("q").value = state.query;
        renderExplorer();
        activateTab(document.getElementById("tab-explorer"), true);
      }));
    }

    function getFilteredItems() {
      const q = state.query.trim().toLowerCase();
      let list = DATA.items.filter(item => {
        if (state.severity !== "ALL" && item.severity !== state.severity) return false;
        if (state.theme !== "ALL" && item.theme !== state.theme) return false;
        if (state.sentiment !== "ALL" && item.sentiment !== state.sentiment) return false;
        if (q) {
          const hay = `${item.id} ${item.handle} ${item.venue} ${item.category} ${item.theme} ${item.summary} ${item.summary_en} ${item.verbatim} ${item.verbatim_en}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (state.sort === "severity") {
          const diff = SEV_ORDER[a.severity] - SEV_ORDER[b.severity];
          return diff !== 0 ? diff : (b.likes || 0) - (a.likes || 0);
        }
        if (state.sort === "date-desc") return b.date.localeCompare(a.date);
        if (state.sort === "likes-desc") return (b.likes || 0) - (a.likes || 0);
        if (state.sort === "views-desc") return (b.views || 0) - (a.views || 0);
        return 0;
      });
      return list;
    }

    let kgMode = "venue";
    document.querySelectorAll(".kg-mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        kgMode = btn.dataset.kgmode;
        document.querySelectorAll(".kg-mode-btn").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
        renderThemeKnowledgeGraph(getFilteredItems());
      });
    });

    function normalizeVenueCluster(venue) {
      const v = String(venue || "").toLowerCase();
      if (v.includes("jogja") || v.includes("yogyakarta") || v.includes("uii")) return "Yogyakarta";
      if (v.includes("jakarta") || v.includes("salemba") || v.includes("kuningan") || v.includes("pondok indah") || v.includes("senopati") || v.includes("bc ui")) return "Jakarta";
      if (v.includes("bandung")) return "Bandung";
      if (v.includes("surabaya") || v.includes("unimed") || v.includes("medan")) return "Surabaya / Medan";
      if (v.includes("copenhagen")) return "Denmark (Contrast)";
      if (v.includes("idp") && !v.includes("bc")) return "Mitra IDP";
      return "BC Indonesia (General)";
    }

    function renderThemeKnowledgeGraph(list) {
      const t = I18N[lang];
      const box = document.getElementById("kg-container");
      const readout = document.getElementById("kg-readout");
      readout.textContent = t.kgDefaultReadout;
      if (!list.length) {
        box.innerHTML = `<p class="subtitle" style="text-align:center; padding:24px;">${escapeHtml(t.kgEmpty)}</p>`;
        return;
      }

      const w = 1000, h = 400;
      const themesPresent = DATA.themes.map(th => {
        const sub = list.filter(i => i.theme === th.name);
        return { id: th.name, short: th.name.split(":")[0], full: lang === "en" ? th.name_en : th.name, count: sub.length, likes: sub.reduce((s, i) => s + (i.likes || 0), 0) };
      }).filter(x => x.count > 0);

      const themeColor = id => id.startsWith("T1") ? "var(--critical)" : (id.startsWith("T2") || id.startsWith("T3")) ? "var(--high)" : id.startsWith("T6") ? "var(--low)" : "var(--accent)";

      let nodes = [];
      let edges = [];

      if (kgMode === "venue") {
        const sevs = ["Critical", "High", "Medium", "Low"].map(s => ({
          id: `SEV:${s}`, raw: s, label: s, count: list.filter(i => i.severity === s).length, color: SEV_COLORS[s]
        })).filter(x => x.count > 0);

        const venueMap = {};
        list.forEach(i => {
          const vc = normalizeVenueCluster(i.venue);
          venueMap[vc] = (venueMap[vc] || 0) + 1;
        });
        const venues = Object.entries(venueMap).sort((a, b) => b[1] - a[1]).map(([v, cnt]) => ({
          id: `VEN:${v}`, raw: v, label: v, count: cnt, color: "var(--muted)"
        }));

        const placeCol = (arr, x, kind) => arr.forEach((n, idx) => {
          const y = ((idx + 1) / (arr.length + 1)) * (h - 44) + 22;
          nodes.push({ ...n, x, y, kind, r: Math.min(24, 11 + Math.sqrt(n.count) * 3.2) });
        });
        placeCol(sevs, 140, "severity");
        placeCol(themesPresent, 460, "theme");
        placeCol(venues, 750, "venue");

        // Edges: Severity -> Theme and Theme -> Venue
        const eSevTh = {};
        const eThVen = {};
        list.forEach(i => {
          const k1 = `SEV:${i.severity}||${i.theme}`;
          eSevTh[k1] = (eSevTh[k1] || 0) + 1;
          const k2 = `${i.theme}||VEN:${normalizeVenueCluster(i.venue)}`;
          eThVen[k2] = (eThVen[k2] || 0) + 1;
        });
        Object.entries(eSevTh).forEach(([k, wgt]) => {
          const [a, b] = k.split("||");
          edges.push({ from: a, to: b, weight: wgt, color: SEV_COLORS[a.replace("SEV:", "")] });
        });
        Object.entries(eThVen).forEach(([k, wgt]) => {
          const [a, b] = k.split("||");
          edges.push({ from: a, to: b, weight: wgt, color: themeColor(a) });
        });
      } else {
        // Mode: Themes <-> Top Handles
        const handleStats = {};
        list.forEach(i => {
          if (!handleStats[i.handle]) handleStats[i.handle] = { count: 0, score: 0, sev: i.severity };
          handleStats[i.handle].count += 1;
          handleStats[i.handle].score += (i.likes || 0) + (i.views || 0) / 1000 + (i.severity === "Critical" ? 500 : i.severity === "High" ? 100 : 10);
        });
        const topHandles = Object.entries(handleStats).sort((a, b) => b[1].score - a[1].score).slice(0, 10)
          .map(([hdl, st]) => ({ id: `ACT:${hdl}`, raw: hdl, label: hdl, count: st.count, color: SEV_COLORS[st.sev] }));

        const placeCol = (arr, x, kind) => arr.forEach((n, idx) => {
          const y = ((idx + 1) / (arr.length + 1)) * (h - 44) + 22;
          nodes.push({ ...n, x, y, kind, r: Math.min(25, 11 + Math.sqrt(n.count) * 3.5) });
        });
        placeCol(themesPresent, 270, "theme");
        placeCol(topHandles, 720, "actor");

        const eThAct = {};
        const topSet = new Set(topHandles.map(a => a.raw));
        list.forEach(i => {
          if (topSet.has(i.handle)) {
            const k = `${i.theme}||ACT:${i.handle}`;
            eThAct[k] = (eThAct[k] || 0) + 1;
          }
        });
        Object.entries(eThAct).forEach(([k, wgt]) => {
          const [a, b] = k.split("||");
          edges.push({ from: a, to: b, weight: wgt, color: themeColor(a) });
        });
      }

      const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
      const svgEdges = edges.map(e => {
        const a = nodeById[e.from], b = nodeById[e.to];
        if (!a || !b) return "";
        const dx = (b.x - a.x) * 0.45;
        const d = `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
        const sw = Math.min(7, 1.3 + e.weight * 0.65);
        return `<path class="kg-edge" data-from="${escapeHtml(e.from)}" data-to="${escapeHtml(e.to)}" data-w="${e.weight}" d="${d}" stroke="${e.color}" stroke-opacity="0.38" stroke-width="${sw.toFixed(1)}" />`;
      }).join("");

      const svgNodes = nodes.map(n => {
        const fill = n.kind === "theme" ? themeColor(n.id) : n.color;
        const lblText = n.kind === "theme" ? `${n.short} (${n.count})` : `${n.label} (${n.count})`;
        const textAnchor = n.kind === "theme" ? "middle" : (n.x < 300 ? "start" : "end");
        const tx = n.kind === "theme" ? n.x : (n.x < 300 ? n.x - n.r - 6 : n.x + n.r + 6);
        const ty = n.kind === "theme" ? n.y + n.r + 14 : n.y + 4;
        const clampedTx = Math.max(8, Math.min(w - 8, tx));
        const anchorFinal = n.kind === "theme" ? "middle" : (n.x < 300 ? "end" : "start");
        const posTx = n.kind === "theme" ? n.x : (n.x < 300 ? n.x - n.r - 7 : n.x + n.r + 7);
        return `
          <g class="kg-node" role="button" tabindex="0" data-nid="${escapeHtml(n.id)}" data-kind="${n.kind}" data-raw="${escapeHtml(n.raw || n.id)}" data-full="${escapeHtml(n.full || n.label)}" data-cnt="${n.count}" aria-label="${escapeHtml(lblText)}">
            <circle cx="${n.x}" cy="${n.y}" r="${n.r.toFixed(1)}" fill="${fill}" fill-opacity="0.9" stroke="var(--surface)" stroke-width="2" />
            <text x="${posTx}" y="${ty}" text-anchor="${anchorFinal}" font-size="11.5" font-weight="600" fill="var(--text)">${escapeHtml(lblText)}</text>
          </g>
        `;
      }).join("");

      box.innerHTML = `
        <svg class="kg-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${escapeHtml(t.kgTitle)}">
          ${svgEdges}
          ${svgNodes}
        </svg>
      `;

      const allNodes = Array.from(box.querySelectorAll(".kg-node"));
      const allEdges = Array.from(box.querySelectorAll(".kg-edge"));

      function highlightNode(nid, fullLabel, cnt) {
        const connected = new Set([nid]);
        const links = [];
        allEdges.forEach(e => {
          const match = e.dataset.from === nid || e.dataset.to === nid;
          e.classList.toggle("kg-dim", !match);
          e.setAttribute("stroke-opacity", match ? "0.85" : "0.08");
          if (match) {
            connected.add(e.dataset.from);
            connected.add(e.dataset.to);
            const otherId = e.dataset.from === nid ? e.dataset.to : e.dataset.from;
            const otherNode = nodeById[otherId];
            if (otherNode) links.push(`${otherNode.short || otherNode.label} (${e.dataset.w})`);
          }
        });
        allNodes.forEach(nd => nd.classList.toggle("kg-dim", !connected.has(nd.dataset.nid)));
        readout.textContent = `${fullLabel} — ${cnt} ${lang === "en" ? "items" : "item"} | ${lang === "en" ? "Connected:" : "Terhubung:"} ${links.join(", ")}`;
      }

      function clearHighlight() {
        allEdges.forEach(e => { e.classList.remove("kg-dim"); e.setAttribute("stroke-opacity", "0.38"); });
        allNodes.forEach(nd => nd.classList.remove("kg-dim"));
        readout.textContent = t.kgDefaultReadout;
      }

      function applyNodeFilter(nd) {
        const kind = nd.dataset.kind;
        const raw = nd.dataset.raw;
        if (kind === "theme") {
          state.theme = state.theme === raw ? "ALL" : raw;
          document.getElementById("filter-theme").value = state.theme;
          renderExplorer();
        } else if (kind === "severity") {
          setSeverityFilter(state.severity === raw ? "ALL" : raw);
        } else if (kind === "venue") {
          const term = raw.includes("Jakarta") ? "Jakarta" : raw.includes("Surabaya") ? "Surabaya" : raw.includes("General") ? "BC Indonesia" : raw.split(" ")[0];
          state.query = state.query === term ? "" : term;
          document.getElementById("q").value = state.query;
          renderExplorer();
        } else if (kind === "actor") {
          state.query = state.query === raw ? "" : raw;
          document.getElementById("q").value = state.query;
          renderExplorer();
        }
      }

      allNodes.forEach(nd => {
        nd.addEventListener("mouseenter", () => highlightNode(nd.dataset.nid, nd.dataset.full, nd.dataset.cnt));
        nd.addEventListener("focus", () => highlightNode(nd.dataset.nid, nd.dataset.full, nd.dataset.cnt));
        nd.addEventListener("mouseleave", clearHighlight);
        nd.addEventListener("blur", clearHighlight);
        nd.addEventListener("click", () => applyNodeFilter(nd));
        nd.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applyNodeFilter(nd); }
        });
      });
    }

    function renderExplorer() {
      const t = I18N[lang];
      const list = getFilteredItems();
      renderThemeKnowledgeGraph(list);
      document.getElementById("result-count").textContent = t.showingCount(list.length, DATA.items.length);
      const tbody = document.getElementById("explorer-tbody");
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:24px; color:var(--muted);">${escapeHtml(t.noMatch)}</td></tr>`;
        return;
      }
      tbody.innerHTML = list.map(item => `
        <tr>
          <td><strong>${escapeHtml(item.id)}</strong><br><span class="subtitle">${escapeHtml(lang === "en" ? item.recordType_en : item.recordType)}</span></td>
          <td><span class="badge sev-${item.severity}">${item.severity}</span></td>
          <td style="white-space:nowrap;">${escapeHtml(item.date)}</td>
          <td><strong>${escapeHtml(item.handle)}</strong><br><span class="subtitle">${escapeHtml(item.sentiment)}</span></td>
          <td>${escapeHtml(item.venue)}</td>
          <td>${escapeHtml(item.theme)}</td>
          <td class="num">${item.likes !== null ? item.likes.toLocaleString("en-US") : "—"}</td>
          <td class="num">${item.views !== null ? item.views.toLocaleString("en-US") : "—"}</td>
          <td>
            <div style="margin-bottom:6px;">${escapeHtml(lang === "en" ? item.summary_en : item.summary)}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button type="button" class="btn btn-sm open-detail" data-id="${escapeHtml(item.id)}">${escapeHtml(t.viewVerbatim)}</button>
              <button type="button" class="btn btn-sm escalate-item" data-id="${escapeHtml(item.id)}">${escapeHtml(t.addBoardBtn)}</button>
            </div>
          </td>
        </tr>
      `).join("");

      tbody.querySelectorAll(".open-detail").forEach(btn => btn.addEventListener("click", () => openDetailModal(btn.dataset.id)));
      tbody.querySelectorAll(".escalate-item").forEach(btn => btn.addEventListener("click", () => escalateIncidentToBoard(btn.dataset.id)));
    }

    function escalateIncidentToBoard(itemId) {
      const item = DATA.items.find(i => i.id === itemId);
      if (!item) return;
      const customId = `INC-${item.id}`;
      if (!boardTasks.some(t => t.id === customId)) {
        const prio = item.severity === "Critical" ? "P0" : item.severity === "High" ? "P1" : "P2";
        boardTasks.unshift({
          id: customId,
          title: `Tindak lanjuti ${item.handle} (${item.venue}): ${item.summary}`,
          title_en: `Follow up ${item.handle} (${item.venue}): ${item.summary_en}`,
          fn: item.theme.includes("T4") || item.theme.includes("T5") ? "MarComm & PR" : item.theme.includes("T2") ? "IT & Online Speaking" : "Operasional Cabang",
          fn_en: item.theme.includes("T4") || item.theme.includes("T5") ? "MarComm & PR" : item.theme.includes("T2") ? "IT & Online Speaking" : "Branch Operations",
          prio,
          horizon: prio === "P0" ? "0–24 Jam" : "Hari 2–7",
          horizon_en: prio === "P0" ? "0–24 Hours" : "Days 2–7",
          impact: prio === "P0" ? 5 : prio === "P1" ? 4 : 3,
          urgency: prio === "P0" ? 5 : 4,
          effort: 2,
          zone: "action",
          done: false,
          evidence: item.handle
        });
        saveBoardTasks();
        renderBoard();
      }
      activateTab(document.getElementById("tab-board"), true);
    }

    function setSeverityFilter(sev) {
      state.severity = sev;
      document.querySelectorAll(".pill-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sev === sev)));
      renderExplorer();
    }

    document.querySelectorAll(".pill-btn").forEach(btn => btn.addEventListener("click", () => setSeverityFilter(btn.dataset.sev)));
    document.getElementById("q").addEventListener("input", e => { state.query = e.target.value; renderExplorer(); });
    document.getElementById("filter-theme").addEventListener("change", e => { state.theme = e.target.value; renderExplorer(); });
    document.getElementById("filter-sentiment").addEventListener("change", e => { state.sentiment = e.target.value; renderExplorer(); });
    document.getElementById("sort-by").addEventListener("change", e => { state.sort = e.target.value; renderExplorer(); });
    document.getElementById("reset-filters").addEventListener("click", () => {
      state = { severity: "ALL", theme: "ALL", sentiment: "ALL", query: "", sort: "severity" };
      document.getElementById("q").value = "";
      document.getElementById("filter-theme").value = "ALL";
      document.getElementById("filter-sentiment").value = "ALL";
      document.getElementById("sort-by").value = "severity";
      setSeverityFilter("ALL");
    });

    // Methodology Dialog + Detail Dialog with closedby fallback
    function wireDialogLightDismiss(dlg) {
      if (!("closedBy" in HTMLDialogElement.prototype)) {
        const outside = (e) => {
          const r = dlg.getBoundingClientRect();
          return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
        };
        let pressedOutside = false;
        dlg.addEventListener("pointerdown", e => { pressedOutside = outside(e); });
        dlg.addEventListener("pointerup", e => { if (pressedOutside && outside(e)) dlg.close(); });
      }
    }

    const dialog = document.getElementById("detail-dialog");
    const methDialog = document.getElementById("methodology-dialog");
