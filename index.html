    // Board functions
    function buildTaskCard(task, indexInZone, totalInZone) {
      const t = I18N[lang];
      const en = lang === "en";
      const score = calcPriorityScore(task);
      const isAction = task.zone === "action";
      const card = document.createElement("article");
      card.className = `task-card${task.done ? " is-done" : ""}`;
      card.dataset.taskId = task.id;
      card.draggable = true;

      card.innerHTML = `
        <button type="button" class="drag-handle" aria-label="Drag ${escapeHtml(task.id)}">⋮⋮</button>
        <div>
          <div class="task-top">
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
              <span class="badge prio-${task.prio}">${task.prio}</span>
              <span class="score-chip">${en ? "Score" : "Skor"}: ${score}</span>
              <span class="badge" style="background:var(--surface); border:1px solid var(--border); color:var(--muted);">${escapeHtml(en ? (task.fn_en || task.fn) : task.fn)}</span>
              <span class="subtitle">${escapeHtml(en ? (task.horizon_en || task.horizon) : task.horizon)}</span>
            </div>
            ${isAction ? `<label class="subtitle" style="display:flex; align-items:center; gap:5px;"><input type="checkbox" class="toggle-done" ${task.done ? "checked" : ""}> ${escapeHtml(t.doneLabel)}</label>` : ""}
          </div>
          <p class="task-title">${escapeHtml(task.id)} — ${escapeHtml(en ? (task.title_en || task.title) : task.title)}</p>
          <p class="subtitle">${escapeHtml(t.evidenceLbl)} ${escapeHtml(task.evidence || "Manual")}</p>
          <div class="task-controls">
            <label class="subtitle">Imp: <select class="mini-select metric-sel" data-field="impact">${[1,2,3,4,5].map(n => `<option value="${n}" ${task.impact === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
            <label class="subtitle">Urg: <select class="mini-select metric-sel" data-field="urgency">${[1,2,3,4,5].map(n => `<option value="${n}" ${task.urgency === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
            <label class="subtitle">Eff: <select class="mini-select metric-sel" data-field="effort">${[1,2,3,4,5].map(n => `<option value="${n}" ${task.effort === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
            <button type="button" class="btn btn-sm bump-prio" data-dir="-1" ${task.prio === "P0" ? "disabled" : ""}>P↑</button>
            <button type="button" class="btn btn-sm bump-prio" data-dir="1" ${task.prio === "P2" ? "disabled" : ""}>P↓</button>
            <button type="button" class="btn btn-sm move-order" data-dir="-1" ${indexInZone === 0 ? "disabled" : ""}>↑</button>
            <button type="button" class="btn btn-sm move-order" data-dir="1" ${indexInZone === totalInZone - 1 ? "disabled" : ""}>↓</button>
            <button type="button" class="btn btn-sm ${isAction ? "" : "btn-primary"} move-zone">${escapeHtml(isAction ? t.toBacklog : t.toAction)}</button>
          </div>
        </div>
      `;

      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", task.id);
        e.dataTransfer.effectAllowed = "move";
        card.classList.add("is-dragging");
        document.documentElement.classList.add("dragging-active");
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("is-dragging");
        document.documentElement.classList.remove("dragging-active");
        document.querySelectorAll(".drop-list").forEach(z => z.classList.remove("drop-target-hover"));
      });

      card.querySelectorAll(".metric-sel").forEach(sel => sel.addEventListener("change", () => {
        task[sel.dataset.field] = Number(sel.value);
        saveBoardTasks();
        renderBoard();
      }));
      card.querySelectorAll(".bump-prio").forEach(btn => btn.addEventListener("click", () => {
        const order = ["P0", "P1", "P2"];
        task.prio = order[Math.min(2, Math.max(0, order.indexOf(task.prio) + Number(btn.dataset.dir)))];
        saveBoardTasks();
        renderBoard();
      }));
      card.querySelectorAll(".move-order").forEach(btn => btn.addEventListener("click", () => moveTaskWithinZone(task.id, Number(btn.dataset.dir))));
      card.querySelector(".move-zone").addEventListener("click", () => {
        task.zone = isAction ? "backlog" : "action";
        saveBoardTasks();
        renderBoard();
      });
      const doneCb = card.querySelector(".toggle-done");
      if (doneCb) doneCb.addEventListener("change", () => { task.done = doneCb.checked; saveBoardTasks(); renderBoard(); });
      return card;
    }

    function moveTaskWithinZone(taskId, delta) {
      const task = boardTasks.find(t => t.id === taskId);
      if (!task) return;
      const zoneIds = boardTasks.filter(t => t.zone === task.zone).map(t => t.id);
      const pos = zoneIds.indexOf(taskId);
      const targetPos = pos + delta;
      if (targetPos < 0 || targetPos >= zoneIds.length) return;
      const swapId = zoneIds[targetPos];
      const idxA = boardTasks.findIndex(t => t.id === taskId);
      const idxB = boardTasks.findIndex(t => t.id === swapId);
      [boardTasks[idxA], boardTasks[idxB]] = [boardTasks[idxB], boardTasks[idxA]];
      saveBoardTasks();
      renderBoard();
    }

    function placeDraggedTask(taskId, targetZone, clientY, container) {
      const idx = boardTasks.findIndex(t => t.id === taskId);
      if (idx === -1) return;
      const [task] = boardTasks.splice(idx, 1);
      task.zone = targetZone;
      const cards = Array.from(container.querySelectorAll(".task-card:not(.is-dragging)"));
      let insertBeforeId = null;
      for (const c of cards) {
        const rect = c.getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) { insertBeforeId = c.dataset.taskId; break; }
      }
      if (insertBeforeId) boardTasks.splice(boardTasks.findIndex(t => t.id === insertBeforeId), 0, task);
      else boardTasks.push(task);
      saveBoardTasks();
      renderBoard();
    }

    ["backlog-list", "action-list"].forEach(listId => {
      const listEl = document.getElementById(listId);
      listEl.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; listEl.classList.add("drop-target-hover"); });
      listEl.addEventListener("dragleave", (e) => { if (!listEl.contains(e.relatedTarget)) listEl.classList.remove("drop-target-hover"); });
      listEl.addEventListener("drop", (e) => {
        e.preventDefault();
        listEl.classList.remove("drop-target-hover");
        const taskId = e.dataTransfer.getData("text/plain");
        if (taskId) placeDraggedTask(taskId, listEl.dataset.zone, e.clientY, listEl);
      });
    });

    function renderBoard() {
      const t = I18N[lang];
      const q = boardFilter.query.trim().toLowerCase();
      const backlogFiltered = boardTasks.filter(item => {
        if (item.zone !== "backlog") return false;
        if (boardFilter.fn !== "ALL" && item.fn !== boardFilter.fn) return false;
        if (boardFilter.prio !== "ALL" && item.prio !== boardFilter.prio) return false;
        if (q && !`${item.id} ${item.title} ${item.title_en || ""} ${item.fn} ${item.evidence}`.toLowerCase().includes(q)) return false;
        return true;
      });
      const actionItems = boardTasks.filter(item => item.zone === "action");
      const backlogEl = document.getElementById("backlog-list");
      const actionEl = document.getElementById("action-list");
      backlogEl.replaceChildren();
      actionEl.replaceChildren();

      if (!backlogFiltered.length) backlogEl.innerHTML = `<p class="subtitle" style="text-align:center; padding:24px;">${escapeHtml(t.emptyBacklog)}</p>`;
      else backlogFiltered.forEach((item, i) => backlogEl.appendChild(buildTaskCard(item, i, backlogFiltered.length)));

      if (!actionItems.length) actionEl.innerHTML = `<p class="subtitle" style="text-align:center; padding:24px;">${escapeHtml(t.emptyAction)}</p>`;
      else actionItems.forEach((item, i) => actionEl.appendChild(buildTaskCard(item, i, actionItems.length)));

      document.getElementById("backlog-count").textContent = t.backlogCount(backlogFiltered.length, boardTasks.filter(x => x.zone === "backlog").length);
      document.getElementById("action-count").textContent = t.actionCount(actionItems.length, actionItems.filter(x => x.prio === "P0").length, actionItems.filter(x => x.done).length);
    }

    document.getElementById("board-q").addEventListener("input", e => { boardFilter.query = e.target.value; renderBoard(); });
    document.getElementById("board-fn").addEventListener("change", e => { boardFilter.fn = e.target.value; renderBoard(); });
    document.getElementById("board-prio").addEventListener("change", e => { boardFilter.prio = e.target.value; renderBoard(); });

    document.getElementById("sort-by-score").addEventListener("click", () => {
      const prioRank = { P0: 0, P1: 1, P2: 2 };
      boardTasks.sort((a, b) => {
        if (a.zone !== b.zone) return a.zone === "action" ? -1 : 1;
        const scoreDiff = calcPriorityScore(b) - calcPriorityScore(a);
        return scoreDiff !== 0 ? scoreDiff : prioRank[a.prio] - prioRank[b.prio];
      });
      saveBoardTasks();
      renderBoard();
    });

    document.getElementById("add-task-btn").addEventListener("click", () => {
      const inp = document.getElementById("new-task-title");
      const title = inp.value.trim();
      if (!title) return;
      const fn = document.getElementById("new-task-fn").value;
      const newId = `CUSTOM-${String(Date.now()).slice(-4)}`;
      boardTasks.unshift({
        id: newId, title, title_en: title, fn, fn_en: fn, prio: "P1", horizon: "Hari 2–7", horizon_en: "Days 2–7",
        impact: 4, urgency: 4, effort: 2, zone: "backlog", done: false, evidence: lang === "en" ? "User added" : "Ditambahkan pengguna"
      });
      inp.value = "";
      saveBoardTasks();
      renderBoard();
    });

    document.getElementById("reset-board").addEventListener("click", () => {
      boardTasks = structuredClone(DEFAULT_BOARD_TASKS);
      boardFilter = { query: "", fn: "ALL", prio: "ALL" };
      document.getElementById("board-q").value = "";
      document.getElementById("board-fn").value = "ALL";
      document.getElementById("board-prio").value = "ALL";
      saveBoardTasks();
      renderBoard();
    });

    function renderMarComm() {
      const en = lang === "en";
      document.getElementById("marcomm-container").innerHTML = `
        <div class="grid-2">
          <article class="card">
            <h2>${en ? "Public Holding Statement (IG / Web / Threads — ID Copy)" : "Holding Statement Publik (IG / Web / Threads)"}</h2>
            <p class="card-sub">${en ? "SCCT Rebuild + Bolster copy ready for Indonesian audiences." : "Strategi SCCT Rebuild + Bolster: akui masukan peserta, jelaskan perbaikan cabang, dan buka jalur prioritas TRF/hasil."}</p>

Kami memohon maaf atas ketidaknyamanan yang dialami sebagian peserta. Setiap masukan menjadi prioritas evaluasi kami bersama tim Quality Assurance dan pengelola pusat tes di Jakarta, Yogyakarta, Bandung, Surabaya, dan kota lainnya. Saat ini kami tengah menjalankan audit teknis jaringan dan perangkat ruang tes, serta memastikan:
1. Kendala teknis dari sisi pusat tes ditangani langsung di tempat tanpa merugikan peserta.
2. Hasil tes yang masih tertunda segera diselesaikan melalui jalur prioritas.
3. Mekanisme Enquiry on Results (EOR) berjalan transparan dengan pengembalian biaya penuh apabila terjadi perubahan skor.

Jika Anda mengalami kendala hasil tes, verifikasi TRF beasiswa, atau kendala hari H, silakan hubungi tim layanan prioritas kami melalui [Link/Email Resmi CS BC Indonesia] dengan menyertakan nomor referensi tes Anda.</pre>
            <button type="button" class="btn btn-primary copy-tpl" data-target="tpl-holding">${en ? "Copy Holding Statement" : "Salin Holding Statement"}</button>
          </article>

          <article class="card">
            <h2>${en ? "Proactive Candidate Message (Email / WA H-3 — ID Copy)" : "Pesan Proaktif Peserta Terdaftar (Email / WA H-3)"}</h2>
            <p class="card-sub">${en ? "Pre-test reassurance for booked candidates (@thriveward, @fudreee, @phdwith.er)." : "Meredam kecemasan pendaftar baru (@thriveward, @fudreee, @phdwith.er) sebelum hari H."}</p>

- Hak Kenyamanan Teknis: Apabila layar terlalu gelap, suara headset kurang jelas, atau koneksi video terganggu saat ujian berlangsung, segera angkat tangan dan beri tahu pengawas agar dapat ditangani saat itu juga.
- Rilis Hasil & Verifikasi Beasiswa: Hasil computer-based umumnya tersedia dalam 1–2 hari kalender dan dapat diverifikasi langsung oleh institusi/beasiswa melalui portal resmi IELTS. Jika melewati batas waktu atau butuh bantuan verifikasi TRF, hubungi [Kontak Prioritas].</pre>
            <button type="button" class="btn btn-primary copy-tpl" data-target="tpl-pretest">${en ? "Copy Pre-Test Message" : "Salin Pesan Pre-Test H-3"}</button>
          </article>
        </div>

                <tr>

                  <td><strong>${en ? "Days 2–7 (Stabilize)" : "Hari 2–7 (Stabilisasi)"}</strong></td>

          catch { btn.textContent = lang === "en" ? "Copy manually" : "Salin manual"; }
          setTimeout(() => { btn.textContent = orig; }, 1600);

    document.getElementById("export-plan-csv").addEventListener("click", () => {
      const actionItems = boardTasks.filter(t => t.zone === "action");
      const headers = ["Order", "ID", "Priority", "PriorityScore", "Impact", "Urgency", "Effort", "Function", "Horizon", "Status", "Title_ID", "Title_EN", "Evidence"];
      const csvCell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [headers.join(","), ...actionItems.map((t, idx) => [
        idx + 1, t.id, t.prio, calcPriorityScore(t), t.impact, t.urgency, t.effort, t.fn, t.horizon,
        t.done ? "Done" : "Pending", t.title, t.title_en || t.title, t.evidence
      ].map(csvCell).join(","))].join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ielts_bc_prioritized_action_plan.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById("export-csv").addEventListener("click", () => {
      const rows = getFilteredItems();
      const headers = ["ID", "Severity", "Priority", "RecordType", "Category", "Theme", "Sentiment", "Date", "Handle", "Venue", "Views", "Likes", "Replies", "Reposts", "Summary_ID", "Summary_EN", "Verbatim_ID", "URL"];
      const csvCell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [headers.join(","), ...rows.map(r => [
        r.id, r.severity, r.priority, r.recordType, r.category, r.theme, r.sentiment, r.date, r.handle, r.venue,
        r.views ?? "", r.likes ?? "", r.replies ?? "", r.reposts ?? "", r.summary, r.summary_en, r.verbatim, r.url
      ].map(csvCell).join(","))].join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ielts_bc_threads_filtered.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    function renderAll() {
      renderStaticUI();
      renderKPIs();
      renderOverview();
      renderExplorer();
      renderThemes();
      renderRCA();
      renderBoard();
      renderMarComm();
    }

    document.documentElement.lang = lang;
    document.getElementById("lang-id").setAttribute("aria-pressed", String(lang === "id"));
    document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    renderAll();
